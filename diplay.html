<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--display kullanımı
        1-inline: satır içi elemanlar, sadece içerik kadar yer kaplar. Örn: span, a, strong, em
        2-block: blok elemanlar, satır boyunca yer kaplar. Örn: div, p, h1-h6, ul, ol
        3-inline-block: satır içi blok elemanlar, hem satır içi hem de blok özelliklerini taşır. Örn: img, input, button
    -->

    <p style="display: inline;">Paragraf1</p>
    <a href="#" style="display: block;">Link1</a>

</body>
</html>
