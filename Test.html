<!--
     Visual Studio Code kısa yolları:

     1- ALt + Shift + F: Kodları düzenlemek
     2-ctrl + /: Seçili kodları yorum satırı yapmak
     3-ctrl + shift + k: Seçili kodları silmek
     4-ctrl + shift + d: Seçili kodları çoğaltmak
     5-ctrl + shift + l: Seçili kodları aynı anda düzenlemek
     6-ctrl + shift + m: Hataları görmek
     7-ctrl + shift + p: Komut paletini açmak
     8-ctrl + shift + e: Dosya Gezgini'ni açmak
     9-ctrl + shift + f: Tüm dosyalarda arama yapmak
     10-ctrl + shift + n: Yeni dosya oluşturmak
     11-ctrl + shift + t: Kapatılan dosyayı tekrar açmak
     12-ctrl + shift + w: Tüm dosyaları kapatmak
     13-ctrl + shift + s: Dosyayı farklı kaydetmek
     14-ctrl + shift + o: Dosya içindeki fonksiyonları görmek
     15-ctrl + shift + j: Konsolu açmak
     16-ctrl + shift + i: Kodları düzenlemek
     17-ctrl + shift + u: Tüm harfleri büyük yapmak
     18-ctrl + shift + l: Tüm harfleri küçük yapmak
     19-ctrl + shift + c: Kodları kopyalamak
     20-ctrl + shift + v: Kodları yapıştırmak
     21-ctrl + shift + x: Uzantıları yönetmek
     22-ctrl + shift + z: Geri almak
     23-ctrl + shift + y: Yinelemek
     24-ctrl + shift + p: Komut paletini açmak
     25-ALT + yukarı aşağı ok tuşları: Satırları yukarı veya aşağı taşımak 
     
     
-->
